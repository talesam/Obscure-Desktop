[package]
name = "obscure-app"
description = "Obscure: a simple Linux client for Xray-core (GTK4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "obscure"
path = "src/main.rs"

[dependencies]
obscure-core = { path = "../obscure-core" }
gtk.workspace = true
adw.workspace = true
glib.workspace = true
gio.workspace = true
gettext-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
serde_json = "1"
async-channel = "2"
ksni = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background", "screenshot", "global_shortcuts"] }
rqrr = "0.11"
percent-encoding = "2"
futures-util = "0.3"
