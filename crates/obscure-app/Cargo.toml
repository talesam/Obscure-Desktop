[package]
name = "obscure-app"
description = "Obscure: a simple Linux client for Xray-core (GTK4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "obscure"
path = "src/main.rs"

[dependencies]
obscure-core = { path = "../obscure-core" }
gtk.workspace = true
adw.workspace = true
glib.workspace = true
gio.workspace = true
gettext-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
once_cell = "1"
