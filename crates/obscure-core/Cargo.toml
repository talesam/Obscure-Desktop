[package]
name = "obscure-core"
description = "GTK-free core library for Obscure: share links, profiles, Xray config and supervision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "io-util", "net", "fs", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
gio = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "channel"] }
prost = "0.14"
tonic-prost = "0.14"

[dev-dependencies]
tempfile = "3"
